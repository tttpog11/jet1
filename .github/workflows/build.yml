name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Inspect Minecraft sources (temporary)
        continue-on-error: true
        run: |
          gradle genSources --no-daemon > gen.log 2>&1 || tail -40 gen.log
          J=$(find / -name '*sources.jar' -path '*minecraft*' 2>/dev/null | grep -v -i fabric-api | head -3)
          echo "sources jars: $J"
          mkdir -p /tmp/src
          for j in $J; do unzip -q -o "$j" -d /tmp/src || true; done
          mkdir -p mcsrc/renderer
          cp -r /tmp/src/net/minecraft/client/renderer/* mcsrc/renderer/ 2>/dev/null || true
          find /tmp/src -iname '*Sky*' > mcsrc/sky-files.txt
          find / -name 'fabric-rendering-v1*.jar' 2>/dev/null | head -3 > mcsrc/fabric-jars.txt
          for f in $(cat mcsrc/fabric-jars.txt); do unzip -l "$f" | grep -i -E "WorldRender|Sky|HudElement" >> mcsrc/fabric-classes.txt; done
          du -sh mcsrc
          echo "=====SKYFILES"; cat mcsrc/sky-files.txt
          for f in $(grep -E "renderer/SkyRenderer.java|renderer/state/SkyRenderState.java" mcsrc/sky-files.txt); do echo "=====FILE $f"; cat "$f"; done
          echo "=====FABRIC"; cat mcsrc/fabric-classes.txt 2>/dev/null | head -40
          echo "=====PIPELINES"; grep -n "SKY\|END_SKY\|POSITION_TEX" /tmp/src/net/minecraft/client/renderer/RenderPipelines.java | head -30
          echo "=====LEVELRENDERER-SKY"; grep -n -i "sky" /tmp/src/net/minecraft/client/renderer/LevelRenderer.java | head -60
          echo "=====END"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcsrc
          path: mcsrc
          if-no-files-found: ignore

      - name: Build
        run: |
          set +e
          gradle build --no-daemon 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" != "0" ]; then
            ERR=$(grep -E -A3 "error:|What went wrong|Execution failed" build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors::$ERR"
          fi
          exit $CODE

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: oreseer-mod
          path: build/libs/oreseer-*.jar
