name: Build add-on

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Check for the RimuLib jar
        run: |
          if ! ls libs/*rimulib*.jar >/dev/null 2>&1; then
            echo "::error title=RimuLib jar missing::Upload rimulib-1.3.0-fabric.jar into the libs folder of this branch (repo should be private), then re-run."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.1

      - name: Build
        run: |
          set +e
          gradle build --no-daemon 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" != "0" ]; then
            ERR=$(grep -E -A3 "error:|What went wrong|Execution failed" build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors::$ERR"
          fi
          exit $CODE

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cassiopeia-addon
          path: build/libs/*.jar
